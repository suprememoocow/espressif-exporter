name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mise pins the same toolchain versions CI and developers use, so a green build
      # locally means the same thing here.
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - run: mise run lint
      - run: mise run test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: cover.out
          # The tests may fail before writing a profile; that is not an upload error.
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/suprememoocow/espressif-exporter
      - uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 for TrueNAS SCALE, arm64 for a Raspberry Pi fallback.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
