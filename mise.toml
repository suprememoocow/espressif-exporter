[tools]
go = "1.27"
golangci-lint = "2"
gotestsum = "latest"
goreleaser = "2"
hadolint = "latest"
actionlint = "latest"

[tasks.build]
description = "Build the exporter binary"
# CGO is off for the binary so the container image can be distroless/static. It is
# deliberately not set globally: the race detector needs cgo, and disabling it here
# would make `mise run test` fail on Linux while quietly passing on macOS.
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -o bin/espressif-exporter ./cmd/espressif-exporter"

[tasks.test]
description = "Run tests with race detector"
run = "gotestsum -- -race -coverprofile=cover.out ./..."

[tasks.lint]
description = "Lint Go, workflows and Dockerfile"
run = [
  "golangci-lint run",
  "test ! -f Dockerfile || hadolint Dockerfile",
  "test ! -d .github/workflows || actionlint",
]

[tasks.fmt]
description = "Format and tidy"
run = ["go fmt ./...", "go mod tidy"]

[tasks.dev]
description = "Run against the local network using zeroconf discovery"
run = "go run ./cmd/espressif-exporter --config configs/dev.yaml"

[tasks.docker]
description = "Build the container image locally"
run = "docker buildx build --load -t espressif-exporter:dev ."
