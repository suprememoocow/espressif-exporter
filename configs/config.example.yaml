# Production configuration for TrueNAS SCALE, running in a bridged container.
#
# Discovery goes through the host's avahi-daemon over the system D-Bus socket, because a
# bridged container cannot send or receive multicast and so cannot do mDNS itself.
# See deploy/docker-compose.yml for the bind mount that makes this work.

log:
  level: info
  format: json

server:
  listen: ":9826"
  read_header_timeout: 5s
  shutdown_timeout: 10s
  max_requests: 64

discovery:
  # Always configure static alongside avahi, so a total Avahi outage degrades coverage
  # rather than eliminating it. Put anything you alert on in the static list.
  sources: [avahi, static]
  service_types:
    - _esphomelib._tcp
    - _shelly._tcp
    - _http._tcp   # Shelly Gen1 advertise only here

  # Off by default: a Docker bridge network usually has no IPv6 at all, so preferring an
  # IPv6 address would make a device permanently unscrapeable.
  ipv6: false
  allow_cidrs: ["192.168.1.0/24"]
  deny_cidrs: ["169.254.0.0/16", "fe80::/10"]
  stale_after: 24h

  avahi:
    # Empty means $DBUS_SYSTEM_BUS_ADDRESS, then unix:path=/run/dbus/system_bus_socket.
    dbus_address: ""
    # Exits if Avahi is unreachable at startup and is the only live backend. Note that an
    # empty static list below still counts as one live backend, because a static backend
    # with no entries never starts.
    required: true
    startup_timeout: 30s
    resolve_timeout: 5s
    resolve_concurrency: 8
    health_check_interval: 30s
    # Avahi replays its record cache only to a brand-new browser, so this rebrowse is the
    # only thing that re-observes a device that is quiet on mDNS. registry.endpoint_ttl
    # must stay comfortably above it.
    rebrowse_interval: 30m

  static:
    - {id: boiler, kind: shelly, address: 192.168.1.51, port: 80}

registry:
  refresh_interval: 5m
  # How long an address survives with nothing confirming it. An mDNS announcement and a
  # successful scrape both count, so this is not a measure of mDNS chattiness. Keep it
  # above discovery.avahi.rebrowse_interval, or every device goes addressless between
  # rebrowses and its metrics disappear with it.
  endpoint_ttl: 45m
  # Generous on purpose: on a home LAN a twenty-minute absence is a wifi problem, and an
  # alertable probe_success 0 beats a series that silently disappears.
  device_ttl: 90m
  remove_grace: 5m

probe:
  default_timeout: 10s
  timeout_offset: 500ms
  max_concurrent: 32
  cache_ttl: 2s
  backoff:
    failures_before_open: 3
    initial: 15s
    max: 5m
    # Longer, because retrying a wrong password will never succeed and some Shelly
    # firmwares rate-limit repeated auth failures.
    auth_initial: 1m
    auth_max: 15m

shelly:
  auth:
    username: admin
    password_file: /run/secrets/shelly_password
    # Evaluated top to bottom; first match wins. Unset fields inherit from the global.
    overrides:
      - match: {hostname: "shelly1-*"}
        password_file: /run/secrets/shelly_legacy_password
  generic_fallback: true
  # Fetch each device's per-component names (Shelly.GetConfig on Gen2+, /settings on Gen1)
  # so series carry a `name` label. Refreshed on the identity_ttl timer, off the scrape
  # path. Set to false to skip the extra request.
  fetch_config: true

esphome:
  encryption_key_file: /run/secrets/esphome_psk
  require_encryption: false
  port: 6053
  # Legacy plaintext API password, for nodes on firmware older than ESPHome 2026.1.0
  # where it was removed. Such a node accepts the connection, answers DeviceInfo, then
  # closes it. Prefer an encryption key where the firmware supports one.
  # password_file: /run/secrets/esphome_password

metrics:
  percent_as_ratio: true
  text_sensors: true
